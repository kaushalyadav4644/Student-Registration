<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Registration</h1>
        <p class="subtitle">Fill in your details to apply for admission.</p>

        <form id="registrationForm" novalidate>

            <div class="form-group">
                <label for="name">Student Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your full name">
                <small class="error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="roll">Roll Number</label>
                <input type="text" id="roll" name="roll"
                       placeholder="Enter your roll number">
                <small class="error" id="rollError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="example@gmail.com">
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="course">Select Course</label>
                <select id="course" name="course">
                    <option value="">-- Select a course --</option>
                    <option value="BCA">BCA</option>
                    <option value="BSc">B.Sc.</option>
                    <option value="BCom">B.Com.</option>
                    <option value="BTech">B.Tech.</option>
                    <option value="MCA">MCA</option>
                </select>
                <small class="error" id="courseError"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Create a strong password">
                <small class="hint">
                    Use 8+ characters with uppercase, lowercase,
                    a number, and a special character.
                </small>
                <small class="error" id="passwordError"></small>
            </div>

            <div class="form-group">
                <label for="document">Upload Document</label>
                <input type="file" id="document" name="document"
                       accept=".pdf,.jpg,.jpeg,.png">
                <small class="error" id="documentError"></small>
            </div>

            <button type="submit">Register Now</button>

            <p id="successMessage" role="status"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
